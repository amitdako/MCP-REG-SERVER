[project]
name = "rag-mcp-server"
version = "0.1.0"
description = "MCP server for retrieval-augmented question answering over documentation (pgvector + local embeddings)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The test container's /app is read-only for the test user: no pytest cache.
addopts = "-p no:cacheprovider"
markers = [
    "db: needs a running PostgreSQL with pgvector (skipped if unavailable)",
]
