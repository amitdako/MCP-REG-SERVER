name: rag-mcp

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port is only for local debugging/benchmarks; the server uses the compose network.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Not started by `docker compose up`: Claude Code spawns it over stdio with
  #   docker compose -f <path>/docker-compose.yml run --rm -T mcp-server
  mcp-server:
    build:
      context: .
      target: runtime
    image: rag-mcp-server:latest
    profiles: ["server"]
    stdin_open: true
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Put local files here to ingest them as /data/<file>.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  # docker compose run --rm tests
  tests:
    build:
      context: .
      target: test
    image: rag-mcp-server:test
    profiles: ["test"]
    environment:
      # Separate database so tests never touch ingested data.
      DATABASE_URL: postgresql://rag:rag@db:5432/rag_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
